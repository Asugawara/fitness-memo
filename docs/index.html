<script type="module">
import init, * as bindings from '/fitness-memo/fitness-memo-a06cd4738d777b71.js';
const wasm = await init({ module_or_path: '/fitness-memo/fitness-memo-a06cd4738d777b71_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

<body>
<script>
if ('serviceWorker' in navigator) {
  if (location.port === '8080') {                     // trunk serve では SW を使わない
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  } else if (location.search.includes('sw=off')) {    // 脱出口
    // unregister は現在ページの controller を外さないので、後始末が終わってから
    // 自力でリロードする。standalone にはアドレスバーもリロード UI も無い
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))),
      caches.keys().then(ks => Promise.all(
        ks.filter(k => k.startsWith('fitness-memo-')).map(k => caches.delete(k)))),
    ]).then(() => location.replace('./'));
  } else {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    });
  }
}
</script>
</body>

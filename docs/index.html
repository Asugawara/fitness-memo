<!-- ── クローラ向けメタデータ（adr/seo/crawler-metadata-and-hardcoded-origin.md）──
     ★ canonical / og:url / og:image だけは本番 URL のハードコード。ここを読むのは
       検索エンジンと SNS のスクレイパだけで、どちらも本番しか見に来ない。trunk の
       --public-url が書き換えるのは trunk 自身が生成した行だけなので、置換機構
       （stamp-sw.sh に続く 2 本目）を足すと「置換漏れで壊れる経路」が増える。
       manifest を相対に統一した adr/pwa/manifest-relative-urls.md とは対象が違う（あちらはブラウザが
       ローカルでも本番でも読むので、相対でないと両方では成立しない）。
       相対に書き戻すと X / Slack / LINE でカードが出なくなる。
     ★ <title> は fitness-memo のまま。ホーム画面のアイコン下に出る名前を決める
       4 点セット（title / apple-mobile-web-app-title / manifest の name と
       short_name）を崩さない。日本語のキーワードは description / og:title /
       JSON-LD が担う。
     e2e/seo.spec.mjs がこのブロックの内容と「絶対 URL であること」を固定している -->
<meta name="description" content="オフラインで動く筋トレ記録アプリ。種目ごとに前回のセット数・回数・重量を見返しながら記録できます。アカウント登録もサーバ送信もなく、データは端末内だけに保存。iPhone のホーム画面に追加して使える無料の PWA です。">
<link rel="canonical" href="https://asugawara.github.io/fitness-memo/">

<meta property="og:locale" content="ja_JP">

<!-- CSR なので配信される HTML の body にはテキストが 1 文字も無い。Googlebot は JS を
     実行するので通常は問題にならないが、**JS を実行しないクローラ（LLM 系の多くを含む）
     にとっては、ここがこのサイトの本文そのもの**になる。Googlebot のレンダリングが
     失敗・タイムアウトしたときの保険でもある。だから断り書きだけでなく機能まで書く。
     ★ scripting が有効な文書では noscript の中身は要素に parse されず、UA スタイルで
       display:none になる。DOM にもレイアウトにも影響しないので、mount_to_body
       （append）と競合しない。静的コンテンツを body に直接置いて JS で消す方式は、
       wasm のロード完了まで実在してレイアウトシフトを起こすので採らない -->
<noscript>
  <h1>fitness-memo（筋トレメモ）</h1>
  <p>iPhone のホーム画面から起動して完全オフラインで動く、筋トレ記録の PWA です。「前回何をどれだけやったかを見て、同じかそれ以上をやる」というループだけを最短手数で回すことに絞っています。</p>
  <p>種目ごとに前回のセット数・回数・重量を表示し、その日のセットが空なら 1 タップでプリフィルできます。胸 / 背中 / 肩 / 腕 / 脚 / 体幹 の 6 部位 28 種目をプリセットとして持ち、部位も種目も追加・改名・削除ができます。推移グラフは ボリューム / セット数 / 回数 を切り替えられ、記録した体重を右軸の破線として常に重ねます。</p>
  <p>アカウント登録もサーバ通信もありません。記録は端末の localStorage にのみ保存し、JSON で書き出し・読み込みできます。</p>
  <p>表示には JavaScript と WebAssembly が必要です。<a href="https://github.com/Asugawara/fitness-memo">GitHub のリポジトリ</a></p>
</noscript>
<script>
if ('serviceWorker' in navigator) {
  if (location.port === '8080') {                     // trunk serve では SW を使わない
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  } else if (location.search.includes('sw=off')) {    // 脱出口
    // unregister は現在ページの controller を外さないので、後始末が終わってから
    // 自力でリロードする。standalone にはアドレスバーもリロード UI も無い
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))),
      caches.keys().then(ks => Promise.all(
        ks.filter(k => k.startsWith('fitness-memo-')).map(k => caches.delete(k)))),
    ]).then(() => location.replace('./'));
  } else {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    });
  }
}
</script>

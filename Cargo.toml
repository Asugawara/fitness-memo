[package]
name = "fitness-memo"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"     # ★ default features を絶対に削らない（下記）

# UI 系は wasm32 専用にする。cargo test（ホスト）が leptos の巨大な依存グラフを
# ビルドしなくなり、「csr feature がホストで通るか」という未検証の前提自体が消える
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
console_error_panic_hook = "0.1"
# 書き出し / 読み込みの JS interop（src/transfer.rs）で使う。
# leptos の再輸出（leptos::wasm_bindgen）は #[doc(hidden)] なので直接宣言する
wasm-bindgen = "0.2"
js-sys = "0.3"
# ★ 使う API は全て自前で宣言する。tachys 経由で「偶然」有効になっている feature に
#   寄りかかると leptos のパッチ更新で無言に壊れる（Element は現状 tachys が有効化して
#   いるが、Storage / MediaQueryList は有効化していない）
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",         # Window::local_storage（leptos/tachys は有効化しない）
    "Event",
    "EventTarget",
    "Element",         # Document::get_element_by_id / Element::scroll_into_view
    "ScrollIntoViewOptions",  # scroll_into_view_if_needed（block: nearest で必要な分だけ動かす）
    "ScrollLogicalPosition",
    "HtmlElement",     # HtmlElement::focus（セット追加時に回数欄へ / シートを開いたとき dialog 自身へ）
    "MediaQueryList",  # Window::match_media("(display-mode: standalone)")
    # ── ボトムシート（views::Sheet）──
    "HtmlDialogElement",  # show_modal / close / open。tachys も dialog 要素で使うが自前で宣言する
    "MouseEvent",         # 背景タップ判定の client_x / client_y
    "DomRect",            # Element::get_bounding_client_rect（背景タップ判定の箱 / 並び替えの実測）
    # ── 並び替え（adr/ux/drag-to-reorder-in-record-tab.md）──
    # ★ tachys が自分で有効化しているので宣言しなくてもコンパイルは通るが、その「偶然」に
    #   寄りかからない（このファイル冒頭の方針）。set_pointer_capture / scroll_by は
    #   Element / Window の側にあるので、増えるのはこの 1 つだけ
    "PointerEvent",       # pointerdown/move/up の pointer_id / client_y / is_primary
    "KeyboardEvent",      # ドラッグの代わりの Alt + ↑↓（alt_key / key）
    "Crypto",          # Window::crypto → getRandomValues（ID の種）
    "Performance",     # Window::performance（crypto が使えない環境の種の足し）
    # ── 書き出し / 読み込み（src/transfer.rs）──
    "Navigator",           # Window::navigator（views::storage_may_split の user_agent も）
    "ShareData",           # Navigator::share_with_data / can_share_with_data
    "File",                # 共有シートに渡す File（File = ["Blob"]）
    "FilePropertyBag",
    "Blob",                # <a download> 用の Blob
    "BlobPropertyBag",
    "Url",                 # createObjectURL / revokeObjectURL
    "HtmlAnchorElement",   # <a download>（★ iOS では使わない）
    "HtmlInputElement",    # <input type="file">
    "FileList",
    "FileReader",          # 選んだファイルの読み出し
    "Clipboard",           # Navigator::clipboard → writeText（unstable フラグ不要）
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# ★ strip は書かない: strip="symbols" は wasm 生成物を壊す（rust-lang/rust#93294 は現在も open）
# ★ panic="abort" も書かない: wasm32-unknown-unknown はターゲット既定が既に Abort で冗長

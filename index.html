<!-- ★ 静的な値は en。クローラが見るのはここで、英語の description / og:locale と
     揃えてある（adr/seo/static-metadata-in-english.md）。実行時はアプリが
     document.documentElement.lang を UI の言語に書き換える（src/views/mod.rs の App） -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>fitness-memo</title>
<!-- 非推奨タグ。正は manifest の display: standalone。manifest 読込失敗時のフォールバックとして残す。
     apple- 版だけだと Chromium が「Deprecated: use mobile-web-app-capable」を console に出し、
     軽い側 E2E のノイズになるので標準名も併記する -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="fitness-memo">
<!-- favicon はホーム画面アイコンと同じ絵。32 はタブ用に専用サイズを出してある
     （192 からの縮小をブラウザ任せにすると眠くなる）。rel="icon" があれば
     /favicon.ico への暗黙のリクエストも起きないので .ico は置かない -->
<link rel="icon" href="./icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">

<!-- ── クローラ向けメタデータ（adr/seo/crawler-metadata-and-hardcoded-origin.md）──
     ★ canonical / og:url / og:image だけは本番 URL のハードコード。ここを読むのは
       検索エンジンと SNS のスクレイパだけで、どちらも本番しか見に来ない。trunk の
       --public-url が書き換えるのは trunk 自身が生成した行だけなので、置換機構
       （stamp-sw.sh に続く 2 本目）を足すと「置換漏れで壊れる経路」が増える。
       manifest を相対に統一した adr/pwa/manifest-relative-urls.md とは対象が違う（あちらはブラウザが
       ローカルでも本番でも読むので、相対でないと両方では成立しない）。
       相対に書き戻すと X / Slack / LINE でカードが出なくなる。
     ★ **静的メタデータは英語で 1 本に揃える**（adr/seo/static-metadata-in-english.md）。
       description / og:* / JSON-LD / noscript / <html lang> / manifest の lang を
       全部 en にする。混ぜると検索エンジンのページ言語判定が割れるし、
       Googlebot は既定で Accept-Language: en-US で来るので、ブラウザ言語で
       切り替わるアプリはどのみち英語をレンダリングして見せることになる。
       日本語の手掛かりは JSON-LD の alternateName と noscript 末尾の 1 段落に残す。
     ★ <title> は fitness-memo のまま。ホーム画面のアイコン下に出る名前を決める
       4 点セット（title / apple-mobile-web-app-title / manifest の name と
       short_name）は元から英語なので、今回の英語化で触る行は無い。
     e2e/seo.spec.mjs がこのブロックの内容と「絶対 URL であること」を固定している -->
<meta name="description" content="Offline workout log PWA for iPhone. Every exercise shows last time's sets, reps and weight. No account, no server — data stays on your device.">
<link rel="canonical" href="https://asugawara.github.io/fitness-memo/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="fitness-memo">
<meta property="og:locale" content="en_US">
<!-- OGP 画像はアイコンだけで情報量が無いので、「何のアプリか」を伝えるのはこの見出し文
     だけになる -->
<meta property="og:title" content="fitness-memo — an offline workout log that never leaves your phone">
<meta property="og:description" content="Look back at last time's sets, reps and weight, then do the same or a little more. No account, no server.">
<meta property="og:url" content="https://asugawara.github.io/fitness-memo/">
<meta property="og:image" content="https://asugawara.github.io/fitness-memo/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The fitness-memo icon — a white flame on a deep red gradient">
<!-- twitter:title / description / image は og:* にフォールバックするので書かない（二重管理を作らない） -->
<meta name="twitter:card" content="summary_large_image">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "fitness-memo",

  "applicationCategory": "HealthApplication",

  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
  "author": { "@type": "Person", "name": "Asugawara" }
}
</script>

<body>
<!-- CSR なので配信される HTML の body にはテキストが 1 文字も無い。Googlebot は JS を
     実行するので通常は問題にならないが、**JS を実行しないクローラ（LLM 系の多くを含む）
     にとっては、ここがこのサイトの本文そのもの**になる。Googlebot のレンダリングが
     失敗・タイムアウトしたときの保険でもある。だから断り書きだけでなく機能まで書く。
     ★ scripting が有効な文書では noscript の中身は要素に parse されず、UA スタイルで
       display:none になる。DOM にもレイアウトにも影響しないので、mount_to_body
       （append）と競合しない。静的コンテンツを body に直接置いて JS で消す方式は、
       wasm のロード完了まで実在してレイアウトシフトを起こすので採らない -->
<noscript>
  <h1>fitness-memo — an offline workout log</h1>
  <p>A workout-log PWA you launch from the iPhone home screen and use completely offline. It is built around one loop and nothing else: look at what you did last time, then do the same or a little more.</p>
  <p>Every exercise shows last time's sets, reps and weight, and while today's sets are still empty you can prefill them with one tap. 28 exercises across 6 muscle groups (chest / back / shoulders / arms / legs / core) come preset, and groups and exercises can be added, renamed and deleted. The progress chart switches between volume, set count and rep count, and always overlays your body weight as a dashed line on a second axis.</p>
  <p>There is no account and no server. Your log is stored only in this device's localStorage, and you can export and import it as TSV, which opens directly in a spreadsheet.</p>
  <p>Displaying this app requires JavaScript and WebAssembly. <a href="https://github.com/Asugawara/fitness-memo">GitHub repository</a></p>
  <!-- ★ 末尾の 1 段落だけ日本語で残す。アプリ本体は日本語のブラウザには日本語で出るのに、
       JS を実行しないクローラ（LLM 系を含む）に対して日本語の手掛かりが 1 つも
       無くなるのを避ける。scripting 有効な文書では noscript の中身は要素に
       パースされないので、この lang="ja" は狙った読者にだけ効く -->
  <p lang="ja">日本語: fitness-memo（筋トレメモ）は、iPhone のホーム画面から起動して完全オフラインで動く筋トレ記録の PWA です。アカウント登録もサーバ通信もなく、記録は端末の localStorage にのみ保存します。</p>
</noscript>
<script>
if ('serviceWorker' in navigator) {
  if (location.port === '8080') {                     // trunk serve では SW を使わない
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  } else if (location.search.includes('sw=off')) {    // 脱出口
    // unregister は現在ページの controller を外さないので、後始末が終わってから
    // 自力でリロードする。standalone にはアドレスバーもリロード UI も無い
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))),
      caches.keys().then(ks => Promise.all(
        ks.filter(k => k.startsWith('fitness-memo-')).map(k => caches.delete(k)))),
    ]).then(() => location.replace('./'));
  } else {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    });
  }
}
</script>
